[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scrum-master"
version = "0.1.0"
description = "AI Scrum Master & Project Manager agent for GitHub Issues/Milestones (Jira-ready)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyGithub>=2.4",
  "langgraph>=1.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "itsdangerous>=2.2", "python-multipart>=0.0.9", "markdown>=3.6"]
dev = ["pytest>=8"]

[project.scripts]
scrum-agent = "scrum_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrum_agent = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
