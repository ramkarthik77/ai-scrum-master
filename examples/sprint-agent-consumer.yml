# Drop this into ANY repository as .github/workflows/sprint-agent.yml to audit
# that repository's own sprints, without copying the agent's code.
name: Sprint agent

on:
  schedule:
    - cron: "7 13 * * 1-5"
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ai-scrum-master @ git+https://github.com/ramkarthik77/ai-scrum-master@main"
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPLY: ${{ inputs.apply || vars.SCRUM_AGENT_APPLY == 'true' }}
        run: |
          flags=""
          [ "$APPLY" = "true" ] && flags="--apply"
          [ -z "$ANTHROPIC_API_KEY" ] && flags="$flags --no-llm"
          scrum-agent audit "$GITHUB_REPOSITORY" $flags
